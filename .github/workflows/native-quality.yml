name: native-quality

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

jobs:
  dart-lifecycle-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build native library
        run: >-
          cmake -S src -B build/native -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          && cmake --build build/native --parallel 4

      - name: Run Dart finalizer test
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/native/libflutter_pty2.so
        run: flutter test --enable-vmservice test/clean_slate_finalizer_test.dart

      - name: Run Dart lifecycle stress
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/native/libflutter_pty2.so
        run: flutter test test/clean_slate_lifecycle_stress_test.dart

      - name: Build integration fixture
        run: >-
          cmake -S test/fixtures/pty_test_child -B build/pty_test_child -G Ninja
          && cmake --build build/pty_test_child --parallel 4

      - name: Run Dart randomized stress
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/native/libflutter_pty2.so
          PTY_TEST_CHILD: ${{ github.workspace }}/build/pty_test_child/pty_test_child
        run: flutter test test/clean_slate_random_stress_test.dart

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "platforms;android-35" "ndk;28.2.13676358"

      - name: Build Android arm64 native library
        env:
          ANDROID_NDK_VERSION: 28.2.13676358
        run: >-
          cmake -S src -B build/android
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          && cmake --build build/android --parallel 4

  sanitizer:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=23
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure sanitizer build
        run: >-
          cmake -S src -B build/sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFLUTTER_PTY2_BUILD_TESTS=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build native tests
        run: cmake --build build/sanitized --parallel 4

      - name: Run native CTest suite
        run: ctest --test-dir build/sanitized --output-on-failure

      - name: Run full lifecycle stress
        run: build/sanitized/tests/pty_unix_session_stress_test
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: exitcode=23

  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure ThreadSanitizer build
        run: >-
          cmake -S src -B build/thread-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFLUTTER_PTY2_BUILD_TESTS=ON
          "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread

      - name: Build native tests
        run: cmake --build build/thread-sanitized --parallel 4

      - name: Run ThreadSanitizer CTest suite
        run: ctest --test-dir build/thread-sanitized --output-on-failure

      - name: Run ThreadSanitizer lifecycle stress
        run: build/thread-sanitized/tests/pty_unix_session_stress_test
        env:
          PTY_NATIVE_STRESS_CYCLES: 1000
