name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        sdk: [stable, master]

    runs-on: ${{ matrix.os }}

    env:
      DISPLAY: :99 # For Linux x11

    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.sdk }}
          cache: true
          cache-key: flutter # optional, change this to force refresh cache
          cache-path: ${{ runner.tool_cache }}/flutter # optional, change this to specify the cache path
          architecture: x64

      - name: Print Flutter SDK version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build native library
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DFLUTTER_PTY2_BUILD_TESTS=ON && cmake --build build --parallel 4

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Build integration fixture
        run: cmake -S test/fixtures/pty_test_child -B build/pty_test_child && cmake --build build/pty_test_child --parallel 4

      - name: Run tests
        run: flutter test

      - name: Run configured native integration tests
        if: runner.os == 'macOS'
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/libflutter_pty2.dylib
          PTY_TEST_CHILD: ${{ github.workspace }}/build/pty_test_child/pty_test_child
        run: flutter test test/clean_slate_integration_test.dart
