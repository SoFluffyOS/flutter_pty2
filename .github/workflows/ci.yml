name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        sdk: [stable, master]

    runs-on: ${{ matrix.os }}

    env:
      DISPLAY: :99 # For Linux x11

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.sdk }}
          cache: true
          cache-key: flutter # optional, change this to force refresh cache
          cache-path: ${{ runner.tool_cache }}/flutter # optional, change this to specify the cache path
          architecture: x64

      - name: Print Flutter SDK version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify package publish contents
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart pub publish --dry-run

      - name: Verify generated FFI bindings
        run: >-
          dart run ffigen --config ffigen_v2.yaml
          && git diff --exit-code -- lib/src/generated/flutter_pty_bindings_generated.dart

      - name: Audit Unix post-fork child path
        if: runner.os != 'Windows'
        run: python3 tool/check_unix_child_path.py src/unix/pty_unix_spawn.c

      - name: Audit Unix post-fork child path on Windows
        if: runner.os == 'Windows'
        run: python tool/check_unix_child_path.py src/unix/pty_unix_spawn.c

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build native library
        run: >-
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          -DFLUTTER_PTY2_BUILD_TESTS=ON
          && cmake --build build --config Release --parallel 4

      - name: Build integration fixture
        run: >-
          cmake -S test/fixtures/pty_test_child -B build/pty_test_child
          && cmake --build build/pty_test_child --config Release --parallel 4

      - name: Verify iOS native source compiles
        if: runner.os == 'macOS'
        run: >-
          xcrun --sdk iphonesimulator clang
          -target arm64-apple-ios13.0
          -std=c11
          -Wall -Wextra -Werror
          -D_POSIX_C_SOURCE=200809L
          -DDART_SHARED_LIB
          -Isrc
          -Isrc/include
          -Iios/flutter_pty2/Sources/flutter_pty2/include
          -fsyntax-only
          ios/flutter_pty2/Sources/flutter_pty2/flutter_pty.c

      - name: Verify Apple public headers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          diff -u src/flutter_pty.h <(tail -n +2 ios/flutter_pty2/Sources/flutter_pty2/include/flutter_pty2/flutter_pty.h)
          diff -u src/flutter_pty.h <(tail -n +2 macos/flutter_pty2/Sources/flutter_pty2/include/flutter_pty2/flutter_pty.h)

      - name: Lint Apple podspecs
        if: runner.os == 'macOS'
        run: |
          pod lib lint ios/flutter_pty2.podspec --allow-warnings --skip-tests
          pod lib lint macos/flutter_pty2.podspec --allow-warnings --skip-tests

      - name: Run native tests
        if: runner.os != 'Windows'
        env:
          PTY_TEST_CHILD_WINDOWS: ${{ github.workspace }}/build/pty_test_child/Release/pty_test_child.exe
        run: ctest --test-dir build --output-on-failure

      - name: Run Windows native tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $library = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build" -Filter flutter_pty2.dll -Recurse | Select-Object -First 1
          $fixture = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build/pty_test_child" -Filter pty_test_child.exe -Recurse | Select-Object -First 1
          if ($null -eq $library) { throw 'flutter_pty2.dll was not built' }
          if ($null -eq $fixture) { throw 'pty_test_child.exe was not built' }
          $env:PTY_TEST_CHILD_WINDOWS = $fixture.FullName
          $env:PATH = "$($library.DirectoryName);$env:PATH"
          ctest --test-dir build -C Release --output-on-failure

      - name: Run tests
        run: flutter test

      - name: Run configured native integration tests
        if: runner.os == 'macOS'
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/libflutter_pty2.dylib
          PTY_TEST_CHILD: ${{ github.workspace }}/build/pty_test_child/pty_test_child
        run: >-
          flutter test
          test/clean_slate_integration_test.dart
          test/clean_slate_spawn_failure_stress_test.dart

      - name: Run configured native integration tests on Linux
        if: runner.os == 'Linux'
        env:
          FLUTTER_PTY2_LIBRARY: ${{ github.workspace }}/build/libflutter_pty2.so
          PTY_TEST_CHILD: ${{ github.workspace }}/build/pty_test_child/pty_test_child
        run: >-
          flutter test
          test/clean_slate_integration_test.dart
          test/clean_slate_spawn_failure_stress_test.dart

      - name: Install example dependencies for iOS
        if: runner.os == 'macOS'
        working-directory: example
        run: flutter pub get

      - name: Run iOS simulator integration tests
        if: runner.os == 'macOS'
        working-directory: example
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$device_id" ]]; then
            echo 'No available iPhone simulator found.' >&2
            exit 1
          fi
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          flutter test -d "$device_id" integration_test/clean_slate_ios_integration_test.dart

      - name: Run configured clean-slate Windows integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $library = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build" -Filter flutter_pty2.dll -Recurse | Select-Object -First 1
          $fixture = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build/pty_test_child" -Filter pty_test_child.exe -Recurse | Select-Object -First 1
          if ($null -eq $library) { throw 'flutter_pty2.dll was not built' }
          if ($null -eq $fixture) { throw 'pty_test_child.exe was not built' }
          $env:FLUTTER_PTY2_LIBRARY = $library.FullName
          $env:PTY_TEST_CHILD = $fixture.FullName
          $env:PATH = "$($library.DirectoryName);$env:PATH"
          flutter test
          test/clean_slate_windows_integration_test.dart
          test/clean_slate_spawn_failure_stress_test.dart

      - name: Run configured clean-slate Windows large-transfer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $library = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build" -Filter flutter_pty2.dll -Recurse | Select-Object -First 1
          $fixture = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build/pty_test_child" -Filter pty_test_child.exe -Recurse | Select-Object -First 1
          if ($null -eq $library) { throw 'flutter_pty2.dll was not built' }
          if ($null -eq $fixture) { throw 'pty_test_child.exe was not built' }
          $env:FLUTTER_PTY2_LIBRARY = $library.FullName
          $env:PTY_TEST_CHILD = $fixture.FullName
          $env:PTY_LARGE_TRANSFER_BYTES = '104857600'
          $env:PATH = "$($library.DirectoryName);$env:PATH"
          flutter test test/clean_slate_large_transfer_test.dart
