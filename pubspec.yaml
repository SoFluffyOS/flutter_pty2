name: flutter_pty2
description: Dart FFI pseudo-terminal (PTY) for spawning and controlling terminal processes, in Flutter apps and Dart command-line apps.
version: 3.0.0-dev.1
homepage: https://github.com/SoFluffyOS/flutter_pty2
repository: https://github.com/SoFluffyOS/flutter_pty2
issue_tracker: https://github.com/SoFluffyOS/flutter_pty2/issues

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ">=1.2.0 <3.0.0"
  ffi: ^2.0.1
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.2

dev_dependencies:
  ffigen: ^8.0.0
  lints: ^6.0.0
  test: ^1.25.0
